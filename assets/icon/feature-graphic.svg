<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160A33"/>
      <stop offset="0.5" stop-color="#0A0714"/>
      <stop offset="1" stop-color="#05040A"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.92" cy="0.85" r="0.65">
      <stop offset="0" stop-color="#FF3D9A" stop-opacity="0.40"/><stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.6" stop-color="#B44BFF"/><stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.55" stop-color="#6D6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B49CFF"/><stop offset="1" stop-color="#FF7AB8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#g1)"/>
  <rect width="1024" height="500" fill="url(#g2)"/>

  <!-- Marca -->
  <g transform="translate(132,250)">
    <g filter="url(#blur)" opacity="0.8">
      <circle cx="-30" cy="0" r="74" fill="none" stroke="url(#ringA)" stroke-width="22"/>
      <circle cx="30" cy="0" r="74" fill="none" stroke="url(#ringB)" stroke-width="22"/>
    </g>
    <circle cx="-30" cy="0" r="74" fill="none" stroke="url(#ringA)" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="382 83" stroke-dashoffset="-16"/>
    <circle cx="30" cy="0" r="74" fill="none" stroke="url(#ringB)" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="382 83" stroke-dashoffset="175"/>
    <circle cx="0" cy="-74" r="9" fill="#FFFFFF"/>
    <circle cx="0" cy="74" r="9" fill="#FF3D9A"/>
    <circle cx="-104" cy="0" r="7" fill="#22D3EE"/>
    <circle cx="104" cy="0" r="7" fill="#C084FC"/>
  </g>

  <!-- Texto -->
  <text x="292" y="238" font-family="DejaVu Sans" font-size="86" font-weight="bold" fill="#F6F4FF" letter-spacing="-3">plexo</text>
  <text x="296" y="292" font-family="DejaVu Sans" font-size="30" fill="url(#text)" font-weight="bold">Dois apps. Um ecrã.</text>
  <text x="296" y="336" font-family="DejaVu Sans" font-size="19" fill="#A7A2C6">Ecrã dividido com um toque · sem anúncios · sem contas</text>

  <!-- Simbolo de divisao a direita -->
  <g opacity="0.9" transform="translate(880,250)">
    <rect x="-56" y="-110" width="112" height="102" rx="18" fill="#7C5CFF" fill-opacity="0.16" stroke="#7C5CFF" stroke-opacity="0.45"/>
    <rect x="-56" y="8" width="112" height="102" rx="18" fill="#FF3D9A" fill-opacity="0.14" stroke="#FF3D9A" stroke-opacity="0.42"/>
    <rect x="-26" y="-6" width="52" height="6" rx="3" fill="#F6F4FF" fill-opacity="0.55"/>
  </g>
</svg>
