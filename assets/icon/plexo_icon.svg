<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0B3E"/>
      <stop offset="0.55" stop-color="#0B0716"/>
      <stop offset="1" stop-color="#05040A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#FF3D9A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#B44BFF"/>
      <stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#6D6BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow1)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>

  <g filter="url(#soft)" opacity="0.75">
    <circle cx="452" cy="512" r="196" fill="none" stroke="url(#ringA)" stroke-width="58"/>
    <circle cx="572" cy="512" r="196" fill="none" stroke="url(#ringB)" stroke-width="58"/>
  </g>

  <circle cx="452" cy="512" r="196" fill="none" stroke="url(#ringA)" stroke-width="58" stroke-linecap="round"
          stroke-dasharray="1010 222" stroke-dashoffset="-40"/>
  <circle cx="572" cy="512" r="196" fill="none" stroke="url(#ringB)" stroke-width="58" stroke-linecap="round"
          stroke-dasharray="1010 222" stroke-dashoffset="465"/>

  <circle cx="512" cy="300" r="26" fill="#FFFFFF"/>
  <circle cx="512" cy="724" r="26" fill="#FF3D9A"/>
  <circle cx="256" cy="512" r="20" fill="#22D3EE"/>
  <circle cx="768" cy="512" r="20" fill="#C084FC"/>
</svg>
