# Sandbox com pouca RAM (2 vCPU / 1.9 GB): um unico JVM, sem daemons extra.
org.gradle.jvmargs=-Xmx1150m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false

# NOTA: a cache de build do Gradle fica DESLIGADA de proposito.
# Se estiver ligada, um APK de release compilado localmente (sem keystore) pode ser
# reaproveitado na CI e publicado NAO ASSINADO — ja aconteceu uma vez.
org.gradle.caching=false

# Kotlin compila dentro do JVM do Gradle (evita um segundo processo de 1 GB)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
