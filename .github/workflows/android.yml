name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Plexo (APK + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle com cache
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permissao ao wrapper
        run: chmod +x ./gradlew

      - name: Testes unitarios (logica + motor + render)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Preparar keystore de release (se existir nos secrets)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plexo-release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/plexo-release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore de release carregado dos secrets."
          else
            echo "Sem secrets de assinatura: o APK de release saira nao assinado."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Compilar APK release (R8 + assinatura)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar assinatura do APK release
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/sign.txt
          if ! grep -q "Signer #1 certificate DN" /tmp/sign.txt; then
            echo "::error::O APK de release NAO esta assinado. Configure os secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD."
            exit 1
          fi
          echo "APK assinado corretamente."

      - name: Resumo do build
        run: |
          {
            echo "### Plexo — artefactos gerados"
            echo ""
            echo "| Variante | Ficheiro | Tamanho |"
            echo "|---|---|---|"
            for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
              if [ -f "$f" ]; then
                size=$(du -h "$f" | cut -f1)
                echo "| $(basename "$f") | \`$f\` | $size |"
              fi
            done
            echo ""
            echo "Testes: $(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | paste -sd+ | bc) executados."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: plexo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: plexo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar capturas de ecra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plexo-screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30
